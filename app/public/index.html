<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pippolo</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/app.js" defer></script>
</head>
<body>

  <input type="button" value="reset" id="resetBtn">

  <small>
    <ul>
      <li>per modificare una lista o una nota, clicca sul suo nome/contenuto</li>
      <li>per filtrare le note per lista, usa il menu a tendina sopra la tabella note</li>
      <li>per aggiungere una nota, seleziona prima una lista dal menu a tendina</li>
      <li>per modificare uno status, cliccare sullo status corrispondente</li>
    </ul>
  </small>

  <div class="inputs">
    <input class="toHide hidden" type="text" placeholder="Nome Lista" id="listNameField">
    <input class="toHide hidden" type="button" value="[+] LISTA" id="addListButton">
    <input class="toHide hidden" type="button" value="Conferma" id="addListConfirm">
    <input class="toHide hidden" type="button" value="Elimina" id="delListButton">

    <!-- tenuti nascosti per compatibilità JS, non usati direttamente -->
    <input class="toHide hidden" type="button" value="Elimina" id="delNoteButton">
  </div>

  <div class="tables">
    <table id="result1"></table>

    <div class="notes-panel">
      <div class="notes-toolbar">
        <select id="listFilterSelect">
          <option value="">Tutte le liste</option>
        </select>
      </div>

      <div id="addNoteSection" class="hidden add-note-row">
        <span id="addNoteLabel" class="add-note-label"></span>
        <input type="text" placeholder="Contenuto nota..." id="notesContentField">
        <input type="button" value="Aggiungi" id="addNoteButton">
      </div>

      <table id="result2"></table>
    </div>
  </div>

</body>
</html>
