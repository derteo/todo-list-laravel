<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDo List</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
  <script src="../js/login.js" defer></script>
</head>
<body class="auth-body">

  <div class="auth-card">
    <div class="auth-header">
      <span class="auth-brand">ToDo List</span>
      <span class="auth-slash">/</span>
      <span class="auth-title">accedi</span>
    </div>

    <div class="auth-error hidden" id="errorMsg"></div>

    <div class="auth-field">
      <label for="emailField">Email</label>
      <input type="email" id="emailField" placeholder="mario@example.com" autocomplete="username">
    </div>

    <div class="auth-field">
      <label for="passwordField">Password</label>
      <input type="password" id="passwordField" placeholder="••••••••" autocomplete="current-password">
    </div>

    <input type="button" value="Accedi" id="loginBtn" class="auth-btn-primary">

    <p class="auth-footer">
      Non hai un account? <a href="./register.html">Registrati</a>
    </p>
  </div>

</body>
</html>
