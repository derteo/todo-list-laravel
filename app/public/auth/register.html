<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDo List</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
  <script src="../js/register.js" defer></script>
</head>
<body class="auth-body">

  <div class="auth-card">
    <div class="auth-header">
      <span class="auth-brand">ToDo List</span>
      <span class="auth-slash">/</span>
      <span class="auth-title">registrati</span>
    </div>

    <div class="auth-error hidden" id="errorMsg"></div>

    <div class="auth-field">
      <label for="nameField">Nome</label>
      <input type="text" id="nameField" placeholder="Mario Rossi" autocomplete="name">
    </div>

    <div class="auth-field">
      <label for="emailField">Email</label>
      <input type="email" id="emailField" placeholder="mario@example.com" autocomplete="username">
    </div>

    <div class="auth-field">
      <label for="passwordField">Password</label>
      <input type="password" id="passwordField" placeholder="minimo 8 caratteri" autocomplete="new-password">
    </div>

    <div class="auth-field">
      <label for="passwordConfirmField">Conferma password</label>
      <input type="password" id="passwordConfirmField" placeholder="ripeti la password" autocomplete="new-password">
    </div>

    <input type="button" value="Crea account" id="registerBtn" class="auth-btn-primary">

    <p class="auth-footer">
      Hai già un account? <a href="./login.html">Accedi</a>
    </p>
  </div>

</body>
</html>
